name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Mods need a recent Claude Code. `plugin validate` and `plugin test` run
      # offline and need no sign-in.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate manifest, marketplace and hooks module
        run: claude plugin validate .

      - name: Run the mod's tests
        run: claude plugin test .

      - name: Test the setup's choices per machine
        run: python -m unittest discover -s server -v

      # The stand-in model: setup, starting the server detached the way the mod
      # does (output captured, so a server holding the caller's pipes would
      # hang it), the API, and that a second start exits quietly.
      # real-model.yml does the same with the real model.
      - name: Smoke-test setup and server (fake model)
        run: python server/smoke.py --cache "${{ runner.temp }}/pii" --fake
